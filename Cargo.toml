[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/viewer-domain",
    "crates/viewer-application",
    "crates/viewer-infrastructure",
    "crates/viewer-platform-macos",
    "crates/viewer-render-core",
    "crates/viewer-render-wgpu",
    "crates/viewer-test-support",
    "crates/viewer-video-mpv",
]

[workspace.package]
version = "0.1.7"
edition = "2024"
rust-version = "1.87"
license = "Apache-2.0"

[workspace.dependencies]
ammonia = "4.1.3"
async-trait = "0.1"
blake3 = "1.8"
block2 = "0.6.2"
bytemuck = { version = "1.25.1", features = ["derive"] }
dispatch2 = "0.3.1"
encoding_rs = "0.8"
getrandom = "0.4"
libc = "0.2"
libloading = "0.8"
nucleo-matcher = "0.3.1"
notify = { version = "8.2.0", default-features = false, features = ["macos_fsevent"] }
notify-debouncer-full = { version = "0.7.0", default-features = false, features = ["macos_fsevent"] }
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSApplication", "NSAttributedString", "NSBox", "NSColor", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSEvent", "NSFont", "NSGraphics", "NSGraphicsContext", "NSImage", "NSOpenGL", "NSOpenGLView", "NSPasteboard", "NSResponder", "NSStringDrawing", "NSView", "NSWindow", "NSWorkspace", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFData", "CFDictionary", "CFNumber", "CFString", "CFURL"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGImage", "CGPath"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "CVBase", "CVDisplayLink", "CVHostTime", "CVReturn", "objc2-core-graphics"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSError", "NSFileManager", "NSNotification", "NSObject", "NSOperation", "NSString", "NSURL"] }
objc2-image-io = { version = "0.3.2", default-features = false, features = ["std", "CGImageDestination", "CGImageProperties", "CGImageSource", "objc2-core-graphics"] }
objc2-metal-kit = { version = "0.3.2", default-features = false, features = ["std", "MTKView", "objc2-app-kit", "objc2-core-foundation"] }
objc2-quick-look-thumbnailing = { version = "0.3.2", default-features = false, features = ["std", "QLThumbnailGenerationRequest", "QLThumbnailGenerator", "QLThumbnailRepresentation", "block2", "objc2-core-foundation", "objc2-core-graphics"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
raw-window-metal = "1.1.0"
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled", "cache"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-util = "0.7"
trash = { version = "5.2.6", default-features = false }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2.5.0"
wgpu = { version = "30.0.1", default-features = false, features = ["metal", "std", "wgsl"] }
