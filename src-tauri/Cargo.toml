[package]
name = "viewer-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "viewer_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = []
video-feasibility = ["dep:dispatch2", "tauri/macos-private-api"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ammonia.workspace = true
async-trait.workspace = true
libc.workspace = true
objc2-app-kit.workspace = true
pulldown-cmark.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
viewer-application = { path = "../crates/viewer-application" }
viewer-domain = { path = "../crates/viewer-domain" }
viewer-infrastructure = { path = "../crates/viewer-infrastructure" }
viewer-platform-macos = { path = "../crates/viewer-platform-macos" }
viewer-render-core = { path = "../crates/viewer-render-core" }
viewer-render-wgpu = { path = "../crates/viewer-render-wgpu" }
viewer-video-mpv = { path = "../crates/viewer-video-mpv" }

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = { workspace = true, optional = true }
objc2.workspace = true

[dev-dependencies]
tempfile.workspace = true
viewer-test-support = { path = "../crates/viewer-test-support" }

[[test]]
name = "security_boundaries"
path = "../tests/security_boundaries.rs"

[[test]]
name = "m1_desktop_runtime"
path = "../tests/m1_desktop_runtime.rs"

[[test]]
name = "m2_desktop_runtime"
path = "../tests/m2_desktop_runtime.rs"

[[test]]
name = "m3_desktop_runtime"
path = "../tests/m3_desktop_runtime.rs"

[[test]]
name = "m3_drag_export"
path = "../tests/m3_drag_export.rs"

[[test]]
name = "m3_compare_budget"
path = "../tests/m3_compare_budget.rs"

[[test]]
name = "m3_readonly_lifecycle"
path = "../tests/m3_readonly_lifecycle.rs"

[[test]]
name = "video_security_boundaries"
path = "../tests/video_security_boundaries.rs"

[[test]]
name = "video_runtime_lifecycle"
path = "../tests/video_runtime_lifecycle.rs"

[[test]]
name = "video_fixture_matrix"
path = "../tests/video_fixture_matrix.rs"

[[test]]
name = "video_resource_lifecycle"
path = "../tests/video_resource_lifecycle.rs"

[[test]]
name = "video_performance_gate"
path = "../tests/video_performance_gate.rs"
