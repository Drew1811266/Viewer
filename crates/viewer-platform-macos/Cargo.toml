[package]
name = "viewer-platform-macos"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
blake3.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true
viewer-application = { path = "../viewer-application" }
viewer-domain = { path = "../viewer-domain" }

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
dispatch2.workspace = true
libc.workspace = true
notify.workspace = true
notify-debouncer-full.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["NSScreen"] }
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true
objc2-core-video.workspace = true
objc2-foundation.workspace = true
objc2-image-io.workspace = true
objc2-metal-kit.workspace = true
objc2-quick-look-thumbnailing.workspace = true
trash.workspace = true
tauri = { version = "2", default-features = false, features = ["wry"] }
viewer-video-mpv = { path = "../viewer-video-mpv" }
viewer-render-core = { path = "../viewer-render-core" }
viewer-render-wgpu = { path = "../viewer-render-wgpu" }

[dev-dependencies]
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
viewer-test-support = { path = "../viewer-test-support" }
viewer-infrastructure = { path = "../viewer-infrastructure" }

[[test]]
name = "watcher_reconcile"
path = "../../tests/watcher_reconcile.rs"

[[bench]]
name = "image_pipeline"
harness = false
