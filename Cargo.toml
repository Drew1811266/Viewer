[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/viewer-domain",
    "crates/viewer-application",
    "crates/viewer-infrastructure",
    "crates/viewer-platform-macos",
    "crates/viewer-test-support",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
async-trait = "0.1"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFDictionary", "CFNumber", "CFString", "CFURL"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGImage"] }
objc2-image-io = { version = "0.3.2", default-features = false, features = ["std", "CGImageDestination", "CGImageProperties", "CGImageSource", "objc2-core-graphics"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
