name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Foundation verification
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Assert Apple Silicon runner
        shell: bash
        run: test "$(uname -m)" = "arm64"

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Activate pnpm 10.0.0 through Corepack
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.0.0 --activate
          pnpm --version

      - name: Install stable Rust for Apple Silicon
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt --target aarch64-apple-darwin
          rustc --version --verbose

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run foundation verification
        run: pnpm verify

      - name: Install cargo-deny 0.20.2
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Enforce dependency policy
        run: cargo deny check
