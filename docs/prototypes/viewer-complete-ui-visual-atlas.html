<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Viewer Complete UI Visual Atlas</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, "SF Pro Text", "Segoe UI Variable Text", "PingFang SC", "Microsoft YaHei UI", sans-serif;
      --canvas: #f3f3f1;
      --application: #fafaf8;
      --surface: #ffffff;
      --sidebar: #eff0ef;
      --soft: #f5f5f3;
      --border: #dedfdd;
      --text: #23262c;
      --secondary: #555b62;
      --tertiary: #60656c;
      --accent: #5869cf;
      --accent-soft: #eceeff;
      --success: #397158;
      --success-soft: #eff7f2;
      --warning: #76591d;
      --warning-soft: #faf6eb;
      --danger: #b7463f;
      --danger-soft: #fff7f6;
      --shadow-popover: 0 18px 48px rgb(31 35 42 / 17%);
      --shadow-dialog: 0 22px 60px rgb(31 35 42 / 19%);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { background: #e9eae7; color: var(--text); overflow: hidden; }
    button, input, select { color: inherit; font: inherit; }
    button { cursor: pointer; }

    .atlas {
      display: grid;
      grid-template-columns: 232px minmax(0, 1fr);
      height: 100vh;
      min-height: 680px;
    }

    body.embed .atlas { grid-template-columns: minmax(0, 1fr); min-height: 0; }
    body.embed .atlas-sidebar,
    body.embed .atlas-toolbar,
    body.embed .atlas-footer { display: none; }
    body.embed .atlas-main { grid-template-rows: minmax(0, 1fr); }
    body.embed .stage { padding: 0; }
    body.embed .prototype-state-switcher,
    body.embed .prototype-state-dock,
    body.embed .scene-state-bar { display: none; }
    body.embed .stage-inner {
      align-items: center;
      border: 0;
      border-radius: 0;
      padding: 0;
    }
    body.embed .screen-mount { transform: none !important; }
    body.embed .prototype-frame { grid-template-rows: minmax(0, 1fr); }

    .atlas-sidebar {
      background: #f7f7f5;
      border-right: 1px solid #d7d8d5;
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 22px 14px 16px;
    }

    .atlas-brand { padding: 0 8px 20px; }
    .atlas-brand strong { display: block; font-size: 17px; letter-spacing: -.025em; }
    .atlas-brand span { color: var(--secondary); display: block; font-size: 11px; margin-top: 4px; }
    .draft-badge {
      background: var(--accent-soft);
      border-radius: 999px;
      color: #4658b8;
      display: inline-flex;
      font-size: 10px;
      font-weight: 700;
      margin-top: 10px;
      padding: 5px 8px;
    }

    .atlas-nav {
      min-height: 0;
      overflow: auto;
      padding-right: 2px;
    }

    .nav-label {
      color: var(--tertiary);
      font-size: 10px;
      font-weight: 750;
      letter-spacing: .08em;
      margin: 15px 10px 6px;
      text-transform: uppercase;
    }

    .nav-item {
      align-items: center;
      background: transparent;
      border: 0;
      border-radius: 8px;
      color: #555a61;
      display: flex;
      font-size: 12px;
      justify-content: space-between;
      min-height: 34px;
      padding: 7px 10px;
      text-align: left;
      width: 100%;
    }

    .nav-item:hover { background: #efefed; }
    .nav-item:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }
    .nav-item[aria-current="page"] {
      background: var(--surface);
      box-shadow: inset 2px 0 var(--accent), 0 1px 3px rgb(31 35 42 / 8%);
      color: #394aa8;
      font-weight: 700;
    }
    .nav-item span:last-child { color: var(--tertiary); font-size: 9px; }

    .atlas-note {
      border-top: 1px solid var(--border);
      color: var(--secondary);
      font-size: 10px;
      line-height: 1.5;
      margin-top: auto;
      padding: 14px 8px 0;
    }

    .atlas-main {
      display: grid;
      grid-template-rows: 64px minmax(0, 1fr) 34px;
      min-width: 0;
    }

    .atlas-toolbar {
      align-items: center;
      background: rgb(250 250 248 / 94%);
      border-bottom: 1px solid #d7d8d5;
      display: flex;
      gap: 12px;
      justify-content: space-between;
      padding: 0 20px;
    }

    .scene-title { min-width: 0; }
    .scene-title strong { display: block; font-size: 15px; letter-spacing: -.015em; }
    .scene-title span {
      color: var(--secondary);
      display: block;
      font-size: 10px;
      margin-top: 3px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .atlas-controls { align-items: center; display: flex; gap: 8px; }
    .atlas-segment {
      background: #ececea;
      border-radius: 9px;
      display: flex;
      padding: 3px;
    }
    .atlas-segment button {
      background: transparent;
      border: 0;
      border-radius: 7px;
      color: var(--secondary);
      font-size: 10px;
      min-height: 28px;
      padding: 5px 9px;
    }
    .atlas-segment button[aria-pressed="true"] {
      background: var(--surface);
      box-shadow: 0 1px 3px rgb(31 35 42 / 10%);
      color: var(--text);
      font-weight: 700;
    }
    .atlas-control {
      background: var(--surface);
      border: 1px solid #d5d7d4;
      border-radius: 8px;
      font-size: 10px;
      min-height: 32px;
      padding: 6px 10px;
    }

    .stage {
      min-height: 0;
      overflow: hidden;
      padding: 18px 20px;
    }

    .stage-inner {
      align-items: flex-start;
      background: #dfe0dd;
      border: 1px solid #d2d3d0;
      border-radius: 18px;
      display: flex;
      height: 100%;
      justify-content: center;
      overflow: auto;
      padding: 18px;
      position: relative;
    }

    .scale-box { flex: 0 0 auto; position: relative; }
    .screen-mount { transform-origin: left top; }
    .atlas-footer {
      align-items: center;
      border-top: 1px solid #d7d8d5;
      color: var(--secondary);
      display: flex;
      font-size: 10px;
      justify-content: space-between;
      padding: 0 20px;
    }
    .coverage { color: #4d5fba; font-weight: 700; }

    .prototype-frame {
      display: grid;
      grid-template-rows: 46px minmax(0, 1fr);
      height: 100%;
      width: 100%;
    }
    .prototype-frame:not(.has-states) { grid-template-rows: minmax(0, 1fr); }
    .prototype-state-dock {
      align-items: center;
      display: flex;
      justify-content: center;
      min-width: 0;
      padding: 4px 10px 6px;
    }
    .prototype-surface { min-height: 0; min-width: 0; }
    .prototype-surface > .viewer-window,
    .prototype-surface > [data-accessible-viewer-state] { height: 100%; }
    .scene-state-bar {
      align-items: center;
      background: rgb(250 250 248 / 96%);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      justify-content: center;
      max-width: 100%;
      padding: 5px;
    }
    .scene-state-bar .state-label {
      color: var(--tertiary);
      font-size: 8px;
      font-weight: 750;
      letter-spacing: .06em;
      padding: 0 5px;
      text-transform: uppercase;
    }
    .scene-state-bar button {
      background: transparent;
      border: 0;
      border-radius: 7px;
      color: var(--secondary);
      font-size: 9px;
      height: 26px;
      padding: 0 8px;
    }
    .scene-state-bar button.active {
      background: var(--surface);
      box-shadow: 0 1px 4px rgb(31 35 42 / 12%);
      color: #4052b4;
      font-weight: 700;
    }
    .scene-state-bar .state-divider { background: var(--border); height: 18px; width: 1px; }

    /* Viewer shell */
    .viewer-window {
      background: var(--application);
      border: 1px solid #cfd1ce;
      border-radius: 16px;
      box-shadow: 0 18px 48px rgb(31 35 42 / 14%);
      height: 100%;
      overflow: hidden;
      position: relative;
      width: 100%;
    }

    .viewer-shell {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      grid-template-rows: 40px minmax(0, 1fr);
      height: 100%;
    }

    .project-head {
      align-items: center;
      background: var(--sidebar);
      border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      padding: 0 14px;
    }
    .project-head strong { font-size: 13px; }
    .project-head button {
      background: transparent;
      border: 0;
      color: var(--secondary);
      font-size: 10px;
      min-height: 32px;
      padding: 6px;
    }
    .project-head.collapsed { justify-content: center; padding: 0 4px; }
    .project-head.collapsed button { padding: 0 4px; white-space: nowrap; }

    .viewer-toolbar {
      align-items: center;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 8px;
      min-width: 0;
      padding: 0 12px;
      position: relative;
      z-index: 12;
    }
    .search-field {
      align-items: center;
      background: var(--soft);
      border: 2px solid transparent;
      border-radius: 10px;
      color: var(--tertiary);
      display: flex;
      flex: 1;
      font-size: 12px;
      height: 32px;
      justify-content: space-between;
      min-width: 160px;
      padding: 0 11px;
    }
    .search-field:focus-within { border-color: var(--accent); }
    .search-field input {
      background: transparent;
      border: 0;
      flex: 1;
      min-width: 0;
      outline: 0;
    }
    .search-field kbd { color: var(--tertiary); font-size: 9px; font-weight: 500; }

    .viewer-button {
      background: var(--surface);
      border: 1px solid #d2d4d1;
      border-radius: 8px;
      font-size: 11px;
      min-height: 32px;
      padding: 0 11px;
    }
    .viewer-button:hover, .viewer-button:focus-visible { background: var(--soft); outline: 0; }
    .viewer-button.active { background: var(--accent-soft); border-color: transparent; color: #4355b5; font-weight: 700; }
    .viewer-button.primary { background: var(--accent); border-color: var(--accent); color: white; }
    .viewer-button.danger { color: var(--danger); }
    .viewer-button:disabled { color: #a0a3a8; cursor: default; }

    .viewer-sidebar {
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      color: #555a61;
      overflow: auto;
      padding: 12px 9px;
    }
    .viewer-sidebar[data-mode="drop"] {
      box-shadow: inset 0 0 0 2px var(--accent);
    }
    .viewer-sidebar[data-mode="collapsed"] {
      overflow: hidden;
      padding-left: 5px;
      padding-right: 5px;
    }
    .viewer-sidebar[data-mode="collapsed"] .tree-label,
    .viewer-sidebar[data-mode="collapsed"] .tree-row span:last-child { display: none; }
    .viewer-sidebar[data-mode="collapsed"] .tree-row {
      justify-content: center;
      overflow: hidden;
      padding: 0;
      white-space: nowrap;
    }
    .viewer-sidebar[data-mode="collapsed"] .tree-row.child { font-size: 9px; }
    .tree-label {
      color: var(--tertiary);
      font-size: 10px;
      font-weight: 750;
      letter-spacing: .07em;
      margin: 0 8px 6px;
      text-transform: uppercase;
    }
    .tree-row {
      align-items: center;
      border-radius: 6px;
      display: flex;
      font-size: 11px;
      height: 24px;
      justify-content: space-between;
      margin: 1px 0;
      padding: 0 8px;
    }
    .tree-row.child { padding-left: 24px; }
    .tree-row.selected {
      background: var(--accent-soft);
      box-shadow: inset 2px 0 var(--accent);
      color: #4152b4;
      font-weight: 700;
    }
    .tree-row span:last-child { color: var(--tertiary); font-size: 9px; }

    .viewer-content {
      background: var(--surface);
      min-width: 0;
      overflow: auto;
      position: relative;
    }

    .popover {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow-popover);
      padding: 6px;
      position: absolute;
      right: 12px;
      top: 37px;
      width: 190px;
      z-index: 30;
    }
    .menu-row {
      align-items: center;
      background: transparent;
      border: 0;
      border-radius: 7px;
      display: flex;
      font-size: 11px;
      justify-content: space-between;
      min-height: 32px;
      padding: 7px 9px;
      text-align: left;
      width: 100%;
    }
    .menu-row:hover, .menu-row:focus-visible { background: var(--soft); outline: 0; }
    .menu-row.selected { background: var(--accent-soft); color: #4355b5; }
    .menu-row.danger:hover { color: var(--danger); }
    .menu-row[aria-disabled="true"],
    .menu-row.is-disabled {
      background: #f3f3f1;
      color: #777c82;
      cursor: not-allowed;
      opacity: .72;
    }
    .menu-row[aria-disabled="true"]:hover,
    .menu-row.is-disabled:hover { background: #f3f3f1; color: #777c82; }
    .menu-divider { background: var(--border); height: 1px; margin: 6px 3px; }

    /* Overview and browsing */
    .folder-band {
      border-bottom: 1px solid var(--border);
      display: grid;
      grid-template-columns: 180px minmax(0, 1fr);
      min-height: 186px;
    }
    .folder-identity {
      background: #f8f8f6;
      border-right: 1px solid var(--border);
      padding: 18px 16px;
    }
    .folder-identity strong { display: block; font-size: 20px; letter-spacing: -.02em; }
    .folder-identity span { color: var(--secondary); display: block; font-size: 11px; margin-top: 5px; }
    .folder-identity .folder-state { color: var(--warning); font-weight: 700; margin-top: 8px; }
    .filmstrip {
      display: grid;
      gap: 8px;
      grid-auto-columns: minmax(150px, 1fr);
      grid-auto-flow: column;
      min-width: 0;
      overflow: hidden;
      padding: 12px;
    }
    .filmstrip figure {
      align-items: center;
      background: #fafaf9;
      display: flex;
      justify-content: center;
      margin: 0;
      min-width: 0;
      overflow: hidden;
    }
    .filmstrip img, .image-stage img, .result-thumb img, .preview-stage img, .compare-stage img {
      height: 100%;
      object-fit: contain;
      width: 100%;
    }

    .grid-wrap { padding: 12px; }
    .image-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .image-grid .image-card { flex: 0 0 198px; }
    .image-grid[data-density="compact"] {
      gap: 8px;
    }
    .image-grid[data-density="compact"] .image-card { flex-basis: 144px; }
    .image-grid[data-density="compact"] .image-stage { height: 96px; }
    .image-grid[data-density="large"] {
      gap: 16px;
    }
    .image-grid[data-density="large"] .image-card { flex-basis: 252px; }
    .image-grid[data-density="large"] .image-stage { height: 168px; }
    .image-card {
      background: #fbfbfa;
      border: 1px solid #ececea;
      border-radius: 9px;
      cursor: pointer;
      min-width: 0;
      overflow: hidden;
      position: relative;
    }
    .image-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .image-card[data-keyboard-focus="true"] {
      box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--accent);
    }
    .image-stage {
      background: #f7f7f5;
      height: 132px;
      position: relative;
    }
    .image-card.selected .image-stage::after {
      border: 2px solid var(--accent);
      border-radius: 8px;
      content: "";
      inset: 6px;
      pointer-events: none;
      position: absolute;
    }
    .image-meta {
      align-items: center;
      border-top: 1px solid #ececea;
      display: flex;
      gap: 8px;
      justify-content: space-between;
      min-height: 48px;
      padding: 6px 8px;
    }
    .image-meta strong { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .status-tag {
      border-radius: 999px;
      flex: 0 0 auto;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 6px;
    }
    .status-tag.keep { background: var(--success-soft); color: var(--success); }
    .status-tag.pending { background: var(--warning-soft); color: var(--warning); }
    .status-tag.reject { background: var(--danger-soft); color: var(--danger); }
    .selection-summary {
      align-items: center;
      background: rgb(255 255 255 / 96%);
      border: 1px solid var(--border);
      border-radius: 999px;
      bottom: 14px;
      box-shadow: 0 10px 28px rgb(31 35 42 / 13%);
      display: flex;
      gap: 10px;
      left: 50%;
      min-height: 34px;
      padding: 7px 13px;
      position: sticky;
      transform: translateX(-50%);
      width: max-content;
      z-index: 8;
    }
    .selection-summary strong { font-size: 11px; }
    .selection-summary span { color: var(--secondary); font-size: 9px; }
    .other-files {
      border-top: 1px solid var(--border);
      color: var(--secondary);
      font-size: 10px;
      margin-top: 14px;
      padding: 11px 3px 3px;
    }
    .other-files-panel {
      border-top: 1px solid var(--border);
      margin-top: 12px;
      overflow: hidden;
    }
    .other-files-head {
      align-items: center;
      background: var(--surface);
      display: flex;
      font-size: 10px;
      height: 34px;
      justify-content: space-between;
      padding: 0 11px;
    }
    .other-file-row {
      align-items: center;
      border-top: 1px solid #ececea;
      display: grid;
      font-size: 10px;
      gap: 10px;
      grid-template-columns: minmax(0, 1fr) auto auto;
      min-height: 34px;
      padding: 0 11px;
    }
    .other-file-row span:nth-child(2) { color: var(--secondary); }
    .organization-drag-preview {
      background: rgb(255 255 255 / 97%);
      border: 1px solid var(--accent);
      border-radius: 9px;
      box-shadow: var(--shadow-popover);
      font-size: 10px;
      left: 46%;
      padding: 9px 11px;
      position: absolute;
      top: 42%;
      z-index: 19;
    }
    .tree-row[data-drop-target="valid"] {
      background: var(--accent-soft);
      box-shadow: inset 0 0 0 1px var(--accent);
      color: #4052b4;
    }
    .structure-heading {
      align-items: center;
      border-bottom: 1px solid var(--border);
      display: flex;
      height: 42px;
      justify-content: space-between;
      padding: 0 16px;
    }
    .structure-heading strong { font-size: 13px; }
    .structure-heading span { color: var(--secondary); font-size: 9px; }
    .search-empty {
      align-items: center;
      color: var(--secondary);
      display: flex;
      flex-direction: column;
      gap: 7px;
      height: calc(100% - 40px);
      justify-content: center;
    }
    .search-empty strong { color: var(--text); font-size: 14px; }
    .paging-row {
      align-items: center;
      border-top: 1px solid var(--border);
      display: flex;
      font-size: 9px;
      justify-content: space-between;
      padding: 10px 16px;
    }
    .indexing-banner {
      background: var(--accent-soft);
      border-bottom: 1px solid #d9ddfb;
      color: #4052b4;
      font-size: 9px;
      padding: 9px 16px;
    }

    /* Search */
    .search-summary {
      align-items: center;
      border-bottom: 1px solid var(--border);
      display: flex;
      font-size: 11px;
      height: 40px;
      justify-content: space-between;
      padding: 0 16px;
    }
    .result-group {
      align-items: center;
      background: #fafaf8;
      border-bottom: 1px solid var(--border);
      color: var(--secondary);
      display: flex;
      font-size: 10px;
      font-weight: 700;
      height: 28px;
      justify-content: space-between;
      padding: 0 16px;
    }
    .result-row {
      align-items: center;
      border-bottom: 1px solid #ececea;
      display: grid;
      gap: 12px;
      grid-template-columns: 44px minmax(160px, .8fr) minmax(180px, 1fr) auto;
      min-height: 48px;
      padding: 5px 16px;
    }
    .result-row.selected { background: #f8f8ff; box-shadow: inset 2px 0 var(--accent); }
    .result-thumb { background: var(--soft); display: block; height: 36px; overflow: hidden; }
    .result-copy strong, .result-copy span { display: block; }
    .result-copy strong { font-size: 11px; }
    .result-copy span, .result-snippet { color: var(--secondary); font-size: 9px; }
    mark { background: var(--accent-soft); color: #3f51b0; padding: 1px 2px; }
    .filter-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow-popover);
      padding: 15px;
      position: absolute;
      right: 18px;
      top: 12px;
      width: 500px;
      z-index: 20;
    }
    .filter-panel[data-filter-popover] { top: 37px; }
    .panel-title { align-items: center; display: flex; justify-content: space-between; margin-bottom: 13px; }
    .panel-title strong { font-size: 14px; }
    .panel-title button { background: transparent; border: 0; color: var(--secondary); }
    .filter-grid { display: grid; gap: 11px; grid-template-columns: repeat(2, 1fr); }
    .field label,
    .field-label { color: var(--secondary); display: block; font-size: 9px; margin-bottom: 5px; }
    .field select, .field input {
      background: var(--surface);
      border: 1px solid #d4d6d3;
      border-radius: 8px;
      height: 32px;
      padding: 0 9px;
      width: 100%;
    }
    .filter-options { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      background: var(--soft);
      border: 1px solid transparent;
      border-radius: 999px;
      color: var(--secondary);
      font-size: 9px;
      padding: 5px 8px;
    }
    .chip.active { background: var(--accent-soft); color: #4254b8; font-weight: 700; }

    function radialPolarPoint(radius, degrees) {
      const radians = (degrees * Math.PI) / 180;
      return { x: radius * Math.cos(radians), y: radius * Math.sin(radians) };
    }

    function radialSectorPath(innerRadius, outerRadius, startDegrees, endDegrees) {
      const point = (radius, degrees) => {
        const radians = (degrees * Math.PI) / 180;
        return {
          x: Number((168 + radius * Math.cos(radians)).toFixed(2)),
          y: Number((168 + radius * Math.sin(radians)).toFixed(2)),
        };
      };
      const outerStart = point(outerRadius, startDegrees);
      const outerEnd = point(outerRadius, endDegrees);
      const innerEnd = point(innerRadius, endDegrees);
      const innerStart = point(innerRadius, startDegrees);
      return `M ${outerStart.x} ${outerStart.y} A ${outerRadius} ${outerRadius} 0 0 1 ${outerEnd.x} ${outerEnd.y} L ${innerEnd.x} ${innerEnd.y} A ${innerRadius} ${innerRadius} 0 0 0 ${innerStart.x} ${innerStart.y} Z`;
    }

    function radialDemoMarkup(radialState) {
      const descriptions = {

        readonly: ["只读模式", "预览、并排对比和信息继续可用；标记、整理和删除保持原位但禁用。"],
        keyboard: ["键盘模式", "外侧焦点环与扇区激活分离，方向键移动，Enter 执行，Escape 返回触发文件。"],
      };
      const [title, description] = descriptions[radialState];
      const primary = [
        { id: "preview", label: "预览" },
        { id: "mark", label: "标记", secondary: true },
        { id: "organize", label: "整理", secondary: true },

        { id: "compare", label: "并排对比" },
        { id: "info", label: "信息" },
      ];
      const disabledIndexes = radialState === "readonly"
        ? [1, 2, 3]
        : radialState === "disabled"
          ? [2, 3, 4]
          : [];
      const activeIndex = radialState === "gesture"
        ? 2
        : radialState === "mark"
          ? 1
          : radialState === "organize"
            ? 2
            : 0;
      const secondaryKind = radialState === "mark" ? "mark" : radialState === "organize" ? "organize" : null;
      const secondaryItems = secondaryKind === "mark"
        ? ["保留", "待定", "淘汰", "清除", "收藏"]
        : secondaryKind === "organize"
          ? ["重命名", "复制到", "移动到"]
          : [];
      const secondaryAnchor = secondaryKind === "mark" ? -30 : 30;
      const secondaryStart = secondaryAnchor - (secondaryItems.length * 30) / 2;
      const primaryShapes = primary.map((item, index) => {
        const disabled = disabledIndexes.includes(index);
        return `<path class="radial-demo-sector" data-radial-sector data-active="${activeIndex === index}"${disabled ? ' aria-disabled="true"' : ""} d="${radialSectorPath(42, 108, -120 + index * 60, -60 + index * 60)}"></path>`;
      }).join("");
      const secondaryShapes = secondaryItems.map((item, index) => `<path class="radial-demo-sector" data-radial-secondary-sector data-active="${index === 0}" d="${radialSectorPath(112, 168, secondaryStart + index * 30, secondaryStart + (index + 1) * 30)}"></path>`).join("");
      const primaryButtons = primary.map((item, index) => {
        const point = radialPolarPoint(78, -90 + index * 60);
        const disabled = disabledIndexes.includes(index);
        const hasSecondary = item.secondary && !disabled;
        return `<button class="radial-demo-button${item.danger ? " danger" : ""}" type="button" role="menuitem" data-level="primary" data-index="${index}" style="--radial-x:${point.x}px;--radial-y:${point.y}px"${disabled ? ' aria-disabled="true"' : ""}${hasSecondary ? ' aria-haspopup="menu"' : ""}${radialState === "keyboard" && index === 0 ? ' data-keyboard-active="true"' : ""}><span>${item.label}</span>${hasSecondary ? "<small>二级</small>" : ""}</button>`;
      }).join("");
      const secondaryButtons = secondaryItems.map((item, index) => {
        const point = radialPolarPoint(140, secondaryStart + index * 30 + 15);
        return `<button class="radial-demo-button${item === "淘汰" ? " danger" : ""}" type="button" role="menuitem" data-level="secondary" data-index="${index}" style="--radial-x:${point.x}px;--radial-y:${point.y}px"><span>${item}</span></button>`;
      }).join("");
      return `<div class="radial-demo-menu" data-radial-visual-state="${radialState}" role="menu" aria-label="文件操作圆盘">
        <svg class="radial-demo-shapes" viewBox="0 0 336 336" aria-hidden="true">${secondaryKind ? `<g data-secondary-kind="${secondaryKind}">${secondaryShapes}</g>` : ""}${primaryShapes}</svg>
        ${primaryButtons}
        ${secondaryKind ? `<div data-secondary-kind="${secondaryKind}" role="menu" aria-label="${secondaryKind === "mark" ? "标记" : "整理"}二级命令">${secondaryButtons}</div>` : ""}
        <button type="button" class="radial-demo-center" aria-label="关闭文件操作"><strong>3 个文件</strong>${radialState === "readonly" ? "<em>只读</em>" : ""}<span>回到中心取消</span></button>
        ${radialState === "gesture" ? '<span class="radial-gesture-trace" aria-hidden="true"></span>' : ""}
      </div><img class="radial-reference-thumb" src="${references.radial}" alt="已批准圆盘参考缩略图"><aside class="radial-demo-note"><h2>${title}</h2><p>${description}</p></aside>`;
    }

        items: [["no-project", "未打开"], ["drag", "拖入"], ["invalid", "无效拖入"], ["opening", "验证"], ["scanning", "扫描"], ["thumbnails", "缩略图"], ["empty", "空项目"], ["error", "错误"], ["recovery", "恢复"]],
      }]);
      if (state.launch === "scanning" || state.launch === "thumbnails") {
        const taskTitle = state.launch === "scanning" ? "正在扫描项目" : "正在生成缩略图";
        const taskMeta = state.launch === "scanning" ? "已发现 1,284 个文件" : "68 / 100";
        return `${shell(`${states}<div data-launch-state="${state.launch}"><div class="skeleton-grid">${Array.from({ length: 8 }, () => '<div class="skeleton skeleton-card"></div>').join("")}</div><article class="task-surface" role="status" aria-live="polite"><div class="task-head"><strong>${taskTitle}</strong><span>${taskMeta}</span></div><div class="progress-track" role="progressbar" aria-label="${taskTitle}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="45"><div class="progress-fill" style="width:45%"></div></div></article></div>`, { loading: true })}`;
      }
      if (state.launch === "empty" || state.launch === "recovery") {
        const panel = state.launch === "empty"
          ? '<div class="empty-project-state"><strong>这个项目中还没有可显示的文件</strong><p>Viewer 会显示支持的图片、Markdown 与文本文件。</p><button class="viewer-button">在文件管理器中显示</button></div>'
          : '<div class="recovery-state"><strong>项目状态已恢复</strong><p>8 项审阅状态已经恢复，1 项需要重新确认源文件。</p><button class="viewer-button primary">查看需要确认的项目</button></div>';
        return shell(`${states}<div data-launch-state="${state.launch}" class="empty-window">${panel}</div>`, { loading: false });
      }
      const drag = state.launch === "drag" ? '<div class="drop-target"><span>松开以打开项目</span></div>' : state.launch === "invalid" ? '<div class="drop-target invalid"><span>请选择一个文件夹</span></div>' : "";
      let content = '<div class="empty-content" data-no-project><h1>Viewer</h1><p>选择或拖入一个项目文件夹</p><button class="viewer-button primary">选择项目文件夹</button></div>';
      if (state.launch === "opening") {
        content = '<div class="empty-content"><h1>测试图</h1><p>正在验证项目…</p><div class="opening-line"><span></span></div></div>';
      } else if (state.launch === "error") {
        content = '<div class="empty-content"><h1>无法打开项目</h1><p>所选文件夹不可读取，请检查权限或重新选择。</p><button class="viewer-button primary">重新选择</button></div>';
      }
      return `<div class="viewer-window">${states}<div class="empty-window" data-launch-state="${state.launch}">${content}${drag}</div></div>`;
    }

    function resultsScreen() {
      const states = stateBar([{
        label: "结果与通知",
        key: "results",
        items: [["operation", "操作结果"], ["notice", "全局通知"], ["local-error", "局部错误"], ["readonly", "只读"], ["recovery", "恢复"]],
      }]);
      let surface = `<div class="result-inspector-layout"><div class="result-workspace"><div class="image-grid" data-density="compact">${imageCards(0)}</div></div><aside class="result-panel operation-inspector" data-operation-results-inspector><header><strong>移动结果</strong><span class="status-tag pending">2 项需要处理</span></header><div class="result-list"><div class="result-row-compact"><strong>28 个文件已移动到衣服 / A02</strong><span>成功</span></div><div class="result-row-compact"><strong>2C2A7469.JPG</strong><span>名称冲突 · 已跳过</span></div><div class="result-row-compact"><strong>2C2A7536.JPG</strong><span>源文件不可用 · 已跳过</span></div><div class="paging-row"><span>1–3 / 3</span><button class="viewer-button">导出结果</button></div></div></aside></div>`;
      if (state.results === "notice") surface = '<div style="padding:18px"><div class="notice-stack" style="position:relative;right:auto;top:auto;justify-items:end"><article class="notice"><div><strong>索引已更新</strong><span>新发现 12 个文件</span></div><button class="viewer-button">查看</button></article><article class="notice"><div><strong>项目已重新连接</strong><span>只读限制已解除</span></div><button class="viewer-button">完成</button></article></div></div>';
      if (state.results === "local-error") surface = `<div class="grid-wrap"><div class="image-grid" data-density="compact">${imageCards(0)}</div></div><div class="local-error">A03 中的一个缩略图无法生成。其它文件仍可继续浏览。　<button class="viewer-button">重试</button></div>`;
      if (state.results === "readonly") surface = `<div class="readonly-banner"><span><strong>只读模式</strong> · 浏览、搜索和预览仍可用；标记与整理已停用。</span><span>权限设置　重新选择目录</span></div><div class="grid-wrap"><div class="image-grid" data-density="compact">${imageCards(0)}</div></div>`;
      if (state.results === "recovery") surface = '<div style="padding:18px"><section class="result-panel"><header><strong>恢复摘要</strong><span class="status-tag keep">已恢复</span></header><div class="result-list"><div class="result-row-compact"><strong>审阅状态</strong><span>8 项恢复</span></div><div class="result-row-compact"><strong>收藏</strong><span>3 项恢复</span></div><div class="result-row-compact"><strong>源文件链接</strong><span>1 项需要检查</span></div></div></section></div>';
      return shell(`${states}<div class="result-layout" data-feedback-state="${state.results}">${surface}</div>`);
    }

    function accessibilityScreen() {
      const states = stateBar([{
        label: "可访问性",
        key: "accessibility",
        items: [["keyboard", "键盘"], ["restore", "焦点恢复"], ["reduced", "减少动效"], ["forced", "强制颜色"], ["zoom", "200% 缩放"]],
      }]);
      const descriptions = {
        keyboard: ["完整键盘路径", "Tab 进入工具栏和内容，方向键移动缩略图焦点，Enter 预览，菜单键打开圆盘。"],
        restore: ["焦点返回原位", "关闭预览、圆盘或对话框后，焦点回到触发操作的缩略图或按钮。"],
        reduced: ["减少动效", "关闭呼吸骨架与位移动画，保留即时状态变化和进度数值。"],
        forced: ["强制颜色", "焦点、选中与危险动作在系统强制颜色下仍以边框、文字和结构区分。"],
        zoom: ["200% 界面缩放", "控制保持可见，工作区允许滚动，不隐藏主要操作或依赖悬停。"],
      };
      const [title, description] = descriptions[state.accessibility];
      const focusIndex = ["keyboard", "restore", "forced"].includes(state.accessibility) ? 0 : undefined;
      const selectedCount = ["keyboard", "restore", "forced"].includes(state.accessibility) ? 1 : 0;
      const note = `<aside class="accessible-state-note"><strong>${title}</strong><div style="color:var(--secondary);line-height:1.5;margin-top:4px">${description}</div>${state.accessibility === "restore" ? '<div style="color:var(--accent);font-weight:700;margin-top:5px">焦点已返回：2C2A7469.JPG</div>' : ""}</aside>`;
      const content = `${states}<div class="grid-wrap"><div class="image-grid" data-density="${state.accessibility === "zoom" ? "compact" : "standard"}">${imageCards(selectedCount, { focusIndex })}</div>${selectedCount ? '<div class="selection-summary"><strong>已选择 1 项</strong><span>焦点与选择使用独立视觉层</span></div>' : ""}</div>${note}`;
      return `<div class="accessible-viewer" data-accessibility-state="${state.accessibility}" data-accessible-viewer-state="${state.accessibility}">${shell(content, { sidebarMode: state.accessibility === "zoom" ? "collapsed" : "expanded" })}</div>`;
    }

    const renderers = {
      overview: overviewScreen,
      system: systemScreen,
      sidebar: sidebarScreen,
      folder: folderScreen,
      browser: browserScreen,
      otherFiles: otherFilesScreen,
      search: searchScreen,
      filters: filtersScreen,
      menus: menusScreen,
      preview: previewScreen,
      compare: compareScreen,
      text: textScreen,
      information: informationScreen,
      radial: radialScreen,
      dialogs: dialogsScreen,
      feedback: feedbackScreen,
      results: resultsScreen,
      accessibility: accessibilityScreen,
      launch: launchScreen,
    };

    const mount = document.getElementById("screen-mount");
    const scaleBox = document.getElementById("scale-box");
    const stage = document.getElementById("stage");
    let lastDialogTrigger = null;

    function updateScale() {
      const availableWidth = Math.max(320, stage.clientWidth - 36);
      const availableHeight = Math.max(320, stage.clientHeight - 36);
      const scale = state.fit ? Math.min(1, availableWidth / state.viewport.width, availableHeight / state.viewport.height) : 1;
      mount.style.width = `${state.viewport.width}px`;
      mount.style.height = `${state.viewport.height}px`;
      mount.style.transform = `scale(${scale})`;
      scaleBox.style.width = `${state.viewport.width * scale}px`;
      scaleBox.style.height = `${state.viewport.height * scale}px`;
    }

    function render() {
      const shellScreens = ["sidebar", "folder", "browser", "otherFiles", "search", "filters", "menus", "dialogs", "feedback", "results"];
      if (!shellScreens.includes(state.screen)) state.openMenu = null;
      const template = document.createElement("template");
      template.innerHTML = renderers[state.screen]();
      const sceneStateBar = template.content.querySelector(".scene-state-bar");
      const stateBarMarkup = sceneStateBar?.outerHTML ?? "";
      sceneStateBar?.remove();
      mount.innerHTML = `<div class="prototype-frame${stateBarMarkup ? " has-states" : ""}">${stateBarMarkup ? `<div class="prototype-state-dock">${stateBarMarkup}</div>` : ""}<div class="prototype-surface">${template.innerHTML}</div></div>`;
      document.getElementById("scene-name").textContent = screenMeta[state.screen][0];
      document.getElementById("scene-description").textContent = screenMeta[state.screen][1];
      document.querySelectorAll(".nav-item").forEach((item) => item.setAttribute("aria-current", item.dataset.screen === state.screen ? "page" : "false"));
      document.querySelectorAll("[data-viewport]").forEach((button) => button.setAttribute("aria-pressed", String(Number(button.dataset.viewport) === state.viewport.width)));
      document.getElementById("fit-control").textContent = state.fit ? "适应窗口" : "原始尺寸";
      updateScale();
    }

    document.addEventListener("click", (event) => {
      const nav = event.target.closest("[data-screen]");
      if (nav) {
        state.screen = nav.dataset.screen;
        state.openMenu = null;
        if (state.screen === "dialogs") {
          state.dialogOpen = true;
          lastDialogTrigger = nav;
        }
        render();
        return;
      }
      const viewport = event.target.closest("[data-viewport]");
      if (viewport) {
        state.viewport = viewport.dataset.viewport === "1024" ? { width: 1024, height: 720 } : { width: 1440, height: 900 };
        render();
        return;
      }
      if (event.target.closest("#fit-control")) {
        state.fit = !state.fit;
        render();
        return;
      }
      const menu = event.target.closest("[data-open]");
      if (menu) {
        const type = menu.dataset.open;
        state.openMenu = state.openMenu === type ? null : type;
        render();
        return;
      }
      const dialog = event.target.closest("[data-dialog]");
      if (dialog) {
        state.dialog = dialog.dataset.dialog;
        state.dialogOpen = true;
        lastDialogTrigger = dialog;
        render();
        return;
      }
      const launch = event.target.closest("[data-launch]");
      if (launch) {
        state.launch = launch.dataset.launch;
        render();
        return;
      }
      const sceneState = event.target.closest("[data-state]");
      if (sceneState) {
        state[sceneState.dataset.stateGroup] = sceneState.dataset.stateValue;
        if (sceneState.dataset.stateGroup === "dialog") state.dialogOpen = true;
        render();
        return;
      }
      const card = event.target.closest(".image-card");
      if (card) {
        card.classList.toggle("selected");
        card.setAttribute("aria-selected", String(card.classList.contains("selected")));
        const summary = mount.querySelector(".selection-summary strong");
        if (summary) {
          const count = mount.querySelectorAll(".image-card.selected").length;
          summary.textContent = `已选择 ${count} 项`;
        }
      }
    });

    document.addEventListener("contextmenu", (event) => {
      if (event.target.closest(".image-card")) {
        event.preventDefault();
        state.screen = "radial";
        render();
      }
    });

    document.addEventListener("keydown", (event) => {
      const card = event.target.closest?.(".image-card");
      if (card && (event.key === "Enter" || event.key === " ")) {
        event.preventDefault();
        card.classList.toggle("selected");
        card.setAttribute("aria-selected", String(card.classList.contains("selected")));
        const summary = mount.querySelector(".selection-summary strong");
        if (summary) {
          const count = mount.querySelectorAll(".image-card.selected").length;
          summary.textContent = `已选择 ${count} 项`;
        }
        return;
      }
      if (event.key === "Escape") {
        if (state.dialogOpen && state.screen === "dialogs") {
          state.dialogOpen = false;
          render();
          lastDialogTrigger?.focus();
          return;
        }
        if (state.openMenu) {
          state.openMenu = null;
          render();
        }
      }
    });

    new ResizeObserver(updateScale).observe(stage);
    render();
  </script>
</body>
</html>
