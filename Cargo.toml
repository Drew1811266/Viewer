[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/viewer-domain",
    "crates/viewer-application",
    "crates/viewer-infrastructure",
    "crates/viewer-platform-macos",
    "crates/viewer-test-support",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
async-trait = "0.1"
blake3 = "1.8"
block2 = "0.6.2"
getrandom = "0.4"
libc = "0.2"
nucleo-matcher = "0.3.1"
objc2 = "0.6.4"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFDictionary", "CFNumber", "CFString", "CFURL"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGImage"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSError", "NSObject", "NSString", "NSURL"] }
objc2-image-io = { version = "0.3.2", default-features = false, features = ["std", "CGImageDestination", "CGImageProperties", "CGImageSource", "objc2-core-graphics"] }
objc2-quick-look-thumbnailing = { version = "0.3.2", default-features = false, features = ["std", "QLThumbnailGenerationRequest", "QLThumbnailGenerator", "QLThumbnailRepresentation", "block2", "objc2-core-foundation", "objc2-core-graphics"] }
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled", "cache"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
trash = { version = "5.2.6", default-features = false }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2.5.0"
