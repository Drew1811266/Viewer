<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Viewer Complete UI Visual Atlas</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, "SF Pro Text", "Segoe UI Variable Text", "PingFang SC", "Microsoft YaHei UI", sans-serif;
      --canvas: #f3f3f1;
      --application: #fafaf8;
      --surface: #ffffff;
      --sidebar: #eff0ef;
      --soft: #f5f5f3;
      --border: #dedfdd;
      --text: #23262c;
      --secondary: #6b7077;
      --tertiary: #8a8e94;
      --accent: #5869cf;
      --accent-soft: #eceeff;
      --success: #397158;
      --success-soft: #eff7f2;
      --warning: #76591d;
      --warning-soft: #faf6eb;
      --danger: #b7463f;
      --danger-soft: #fff7f6;
      --shadow-popover: 0 18px 48px rgb(31 35 42 / 17%);
      --shadow-dialog: 0 22px 60px rgb(31 35 42 / 19%);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { background: #e9eae7; color: var(--text); overflow: hidden; }
    button, input, select { color: inherit; font: inherit; }
    button { cursor: pointer; }

    .atlas {
      display: grid;
      grid-template-columns: 232px minmax(0, 1fr);
      height: 100vh;
      min-height: 680px;
    }

    body.embed .atlas { grid-template-columns: minmax(0, 1fr); min-height: 0; }
    body.embed .atlas-sidebar,
    body.embed .atlas-toolbar,
    body.embed .atlas-footer { display: none; }
    body.embed .atlas-main { grid-template-rows: minmax(0, 1fr); }
    body.embed .stage { padding: 0; }
    body.embed .prototype-state-switcher { display: none; }
    body.embed .stage-inner {
      align-items: center;
      border: 0;
      border-radius: 0;
      padding: 0;
    }
    body.embed .screen-mount { transform: none !important; }

    .atlas-sidebar {
      background: #f7f7f5;
      border-right: 1px solid #d7d8d5;
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 22px 14px 16px;
    }

    .atlas-brand { padding: 0 8px 20px; }
    .atlas-brand strong { display: block; font-size: 17px; letter-spacing: -.025em; }
    .atlas-brand span { color: var(--secondary); display: block; font-size: 11px; margin-top: 4px; }
    .draft-badge {
      background: var(--accent-soft);
      border-radius: 999px;
      color: #4658b8;
      display: inline-flex;
      font-size: 10px;
      font-weight: 700;
      margin-top: 10px;
      padding: 5px 8px;
    }

    .atlas-nav {
      min-height: 0;
      overflow: auto;
      padding-right: 2px;
    }

    .nav-label {
      color: var(--tertiary);
      font-size: 10px;
      font-weight: 750;
      letter-spacing: .08em;
      margin: 15px 10px 6px;
      text-transform: uppercase;
    }

    .nav-item {
      align-items: center;
      background: transparent;
      border: 0;
      border-radius: 8px;
      color: #555a61;
      display: flex;
      font-size: 12px;
      justify-content: space-between;
      min-height: 34px;
      padding: 7px 10px;
      text-align: left;
      width: 100%;
    }

    .nav-item:hover { background: #efefed; }
    .nav-item:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }
    .nav-item[aria-current="page"] {
      background: var(--surface);
      box-shadow: inset 2px 0 var(--accent), 0 1px 3px rgb(31 35 42 / 8%);
      color: #394aa8;
      font-weight: 700;
    }
    .nav-item span:last-child { color: var(--tertiary); font-size: 9px; }

    .atlas-note {
      border-top: 1px solid var(--border);
      color: var(--secondary);
      font-size: 10px;
      line-height: 1.5;
      margin-top: auto;
      padding: 14px 8px 0;
    }

    .atlas-main {
      display: grid;
      grid-template-rows: 64px minmax(0, 1fr) 34px;
      min-width: 0;
    }

    .atlas-toolbar {
      align-items: center;
      background: rgb(250 250 248 / 94%);
      border-bottom: 1px solid #d7d8d5;
      display: flex;
      gap: 12px;
      justify-content: space-between;
      padding: 0 20px;
    }

    .scene-title { min-width: 0; }
    .scene-title strong { display: block; font-size: 15px; letter-spacing: -.015em; }
    .scene-title span {
      color: var(--secondary);
      display: block;
      font-size: 10px;
      margin-top: 3px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .atlas-controls { align-items: center; display: flex; gap: 8px; }
    .atlas-segment {
      background: #ececea;
      border-radius: 9px;
      display: flex;
      padding: 3px;
    }
    .atlas-segment button {
      background: transparent;
      border: 0;
      border-radius: 7px;
      color: var(--secondary);
      font-size: 10px;
      min-height: 28px;
      padding: 5px 9px;
    }
    .atlas-segment button[aria-pressed="true"] {
      background: var(--surface);
      box-shadow: 0 1px 3px rgb(31 35 42 / 10%);
      color: var(--text);
      font-weight: 700;
    }
    .atlas-control {
      background: var(--surface);
      border: 1px solid #d5d7d4;
      border-radius: 8px;
      font-size: 10px;
      min-height: 32px;
      padding: 6px 10px;
    }

    .stage {
      min-height: 0;
      overflow: hidden;
      padding: 18px 20px;
    }

    .stage-inner {
      align-items: flex-start;
      background: #dfe0dd;
      border: 1px solid #d2d3d0;
      border-radius: 18px;
      display: flex;
      height: 100%;
      justify-content: center;
      overflow: auto;
      padding: 18px;
      position: relative;
    }

    .scale-box { flex: 0 0 auto; position: relative; }
    .screen-mount { transform-origin: left top; }
    .atlas-footer {
      align-items: center;
      border-top: 1px solid #d7d8d5;
      color: var(--secondary);
      display: flex;
      font-size: 10px;
      justify-content: space-between;
      padding: 0 20px;
    }
    .coverage { color: #4d5fba; font-weight: 700; }

    /* Viewer shell */
    .viewer-window {
      background: var(--application);
      border: 1px solid #cfd1ce;
      border-radius: 16px;
      box-shadow: 0 18px 48px rgb(31 35 42 / 14%);
      height: 100%;
      overflow: hidden;
      position: relative;
      width: 100%;
    }

    .viewer-shell {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      grid-template-rows: 40px minmax(0, 1fr);
      height: 100%;
    }

    .project-head {
      align-items: center;
      background: var(--sidebar);
      border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      padding: 0 14px;
    }
    .project-head strong { font-size: 13px; }
    .project-head button {
      background: transparent;
      border: 0;
      color: var(--secondary);
      font-size: 10px;
      padding: 6px;
    }

    .viewer-toolbar {
      align-items: center;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 8px;
      min-width: 0;
      padding: 0 12px;
      position: relative;
      z-index: 12;
    }
    .search-field {
      align-items: center;
      background: var(--soft);
      border: 2px solid transparent;
      border-radius: 10px;
      color: var(--tertiary);
      display: flex;
      flex: 1;
      font-size: 12px;
      height: 32px;
      justify-content: space-between;
      min-width: 160px;
      padding: 0 11px;
    }
    .search-field:focus-within { border-color: var(--accent); }
    .search-field input {
      background: transparent;
      border: 0;
      flex: 1;
      min-width: 0;
      outline: 0;
    }
    .search-field kbd { color: var(--tertiary); font-size: 9px; font-weight: 500; }

    .viewer-button {
      background: var(--surface);
      border: 1px solid #d2d4d1;
      border-radius: 8px;
      font-size: 11px;
      height: 30px;
      padding: 0 11px;
    }
    .viewer-button:hover, .viewer-button:focus-visible { background: var(--soft); outline: 0; }
    .viewer-button.active { background: var(--accent-soft); border-color: transparent; color: #4355b5; font-weight: 700; }
    .viewer-button.primary { background: var(--accent); border-color: var(--accent); color: white; }
    .viewer-button.danger { color: var(--danger); }
    .viewer-button:disabled { color: #a0a3a8; cursor: default; }

    .viewer-sidebar {
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      color: #555a61;
      overflow: auto;
      padding: 12px 9px;
    }
    .tree-label {
      color: var(--tertiary);
      font-size: 10px;
      font-weight: 750;
      letter-spacing: .07em;
      margin: 0 8px 6px;
      text-transform: uppercase;
    }
    .tree-row {
      align-items: center;
      border-radius: 6px;
      display: flex;
      font-size: 11px;
      height: 24px;
      justify-content: space-between;
      margin: 1px 0;
      padding: 0 8px;
    }
    .tree-row.child { padding-left: 24px; }
    .tree-row.selected {
      background: var(--accent-soft);
      box-shadow: inset 2px 0 var(--accent);
      color: #4152b4;
      font-weight: 700;
    }
    .tree-row span:last-child { color: var(--tertiary); font-size: 9px; }

    .viewer-content {
      background: var(--surface);
      min-width: 0;
      overflow: auto;
      position: relative;
    }

    .popover {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow-popover);
      padding: 6px;
      position: absolute;
      right: 12px;
      top: 37px;
      width: 190px;
      z-index: 30;
    }
    .menu-row {
      align-items: center;
      background: transparent;
      border: 0;
      border-radius: 7px;
      display: flex;
      font-size: 11px;
      justify-content: space-between;
      min-height: 32px;
      padding: 7px 9px;
      text-align: left;
      width: 100%;
    }
    .menu-row:hover, .menu-row:focus-visible { background: var(--soft); outline: 0; }
    .menu-row.selected { background: var(--accent-soft); color: #4355b5; }
    .menu-row.danger:hover { color: var(--danger); }
    .menu-divider { background: var(--border); height: 1px; margin: 6px 3px; }

    /* Overview and browsing */
    .folder-band {
      border-bottom: 1px solid var(--border);
      display: grid;
      grid-template-columns: 180px minmax(0, 1fr);
      min-height: 186px;
    }
    .folder-identity {
      background: #f8f8f6;
      border-right: 1px solid var(--border);
      padding: 18px 16px;
    }
    .folder-identity strong { display: block; font-size: 20px; letter-spacing: -.02em; }
    .folder-identity span { color: var(--secondary); display: block; font-size: 11px; margin-top: 5px; }
    .folder-identity .folder-state { color: var(--warning); font-weight: 700; margin-top: 8px; }
    .filmstrip {
      display: grid;
      gap: 8px;
      grid-auto-columns: minmax(150px, 1fr);
      grid-auto-flow: column;
      min-width: 0;
      overflow: hidden;
      padding: 12px;
    }
    .filmstrip figure {
      align-items: center;
      background: #fafaf9;
      display: flex;
      justify-content: center;
      margin: 0;
      min-width: 0;
      overflow: hidden;
    }
    .filmstrip img, .image-stage img, .result-thumb img, .preview-stage img, .compare-stage img {
      height: 100%;
      object-fit: contain;
      width: 100%;
    }

    .grid-wrap { padding: 14px; }
    .image-grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
    .image-card {
      background: #fbfbfa;
      border: 1px solid #ececea;
      border-radius: 9px;
      cursor: pointer;
      min-width: 0;
      overflow: hidden;
      position: relative;
    }
    .image-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .image-stage {
      background: #f7f7f5;
      height: 154px;
      position: relative;
    }
    .image-card.selected .image-stage::after {
      border: 2px solid var(--accent);
      border-radius: 8px;
      content: "";
      inset: 6px;
      pointer-events: none;
      position: absolute;
    }
    .image-meta {
      align-items: center;
      border-top: 1px solid #ececea;
      display: flex;
      gap: 8px;
      justify-content: space-between;
      min-height: 34px;
      padding: 6px 8px;
    }
    .image-meta strong { font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .status-tag {
      border-radius: 999px;
      flex: 0 0 auto;
      font-size: 8px;
      font-weight: 700;
      padding: 3px 6px;
    }
    .status-tag.keep { background: var(--success-soft); color: var(--success); }
    .status-tag.pending { background: var(--warning-soft); color: var(--warning); }
    .status-tag.reject { background: var(--danger-soft); color: var(--danger); }
    .selection-summary {
      align-items: center;
      background: rgb(255 255 255 / 96%);
      border: 1px solid var(--border);
      border-radius: 999px;
      bottom: 14px;
      box-shadow: 0 10px 28px rgb(31 35 42 / 13%);
      display: flex;
      gap: 10px;
      left: 50%;
      min-height: 34px;
      padding: 7px 13px;
      position: sticky;
      transform: translateX(-50%);
      width: max-content;
      z-index: 8;
    }
    .selection-summary strong { font-size: 11px; }
    .selection-summary span { color: var(--secondary); font-size: 9px; }
    .other-files {
      border-top: 1px solid var(--border);
      color: var(--secondary);
      font-size: 10px;
      margin-top: 14px;
      padding: 11px 3px 3px;
    }

    /* Search */
    .search-summary {
      align-items: center;
      border-bottom: 1px solid var(--border);
      display: flex;
      font-size: 11px;
      height: 40px;
      justify-content: space-between;
      padding: 0 16px;
    }
    .result-group {
      align-items: center;
      background: #fafaf8;
      border-bottom: 1px solid var(--border);
      color: var(--secondary);
      display: flex;
      font-size: 10px;
      font-weight: 700;
      height: 28px;
      justify-content: space-between;
      padding: 0 16px;
    }
    .result-row {
      align-items: center;
      border-bottom: 1px solid #ececea;
      display: grid;
      gap: 12px;
      grid-template-columns: 44px minmax(160px, .8fr) minmax(180px, 1fr) auto;
      min-height: 48px;
      padding: 5px 16px;
    }
    .result-row.selected { background: #f8f8ff; box-shadow: inset 2px 0 var(--accent); }
    .result-thumb { background: var(--soft); display: block; height: 36px; overflow: hidden; }
    .result-copy strong, .result-copy span { display: block; }
    .result-copy strong { font-size: 11px; }
    .result-copy span, .result-snippet { color: var(--secondary); font-size: 9px; }
    mark { background: var(--accent-soft); color: #3f51b0; padding: 1px 2px; }
    .filter-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow-popover);
      padding: 15px;
      position: absolute;
      right: 18px;
      top: 12px;
      width: 500px;
      z-index: 20;
    }
    .panel-title { align-items: center; display: flex; justify-content: space-between; margin-bottom: 13px; }
    .panel-title strong { font-size: 14px; }
    .panel-title button { background: transparent; border: 0; color: var(--secondary); }
    .filter-grid { display: grid; gap: 11px; grid-template-columns: repeat(2, 1fr); }
    .field label { color: var(--secondary); display: block; font-size: 9px; margin-bottom: 5px; }
    .field select, .field input {
      background: var(--surface);
      border: 1px solid #d4d6d3;
      border-radius: 8px;
      height: 32px;
      padding: 0 9px;
      width: 100%;
    }
    .filter-options { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      background: var(--soft);
      border: 1px solid transparent;
      border-radius: 999px;
      color: var(--secondary);
      font-size: 9px;
      padding: 5px 8px;
    }
    .chip.active { background: var(--accent-soft); color: #4254b8; font-weight: 700; }
    .filter-footer { align-items: center; border-top: 1px solid var(--border); display: flex; justify-content: space-between; margin-top: 14px; padding-top: 12px; }

    /* Preview, compare and text */
    .preview-shell {
      background: #f0f1ef;
      display: grid;
      grid-template-rows: 52px minmax(0, 1fr);
      height: 100%;
    }
    .preview-toolbar {
      align-items: center;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: grid;
      gap: 12px;
      grid-template-columns: minmax(180px, 1fr) auto minmax(180px, 1fr);
      padding: 0 14px;
    }
    .preview-identity strong, .preview-identity span { display: block; }
    .preview-identity strong { font-size: 12px; }
    .preview-identity span { color: var(--secondary); font-size: 9px; margin-top: 2px; }
    .segmented {
      background: #efefed;
      border-radius: 9px;
      display: flex;
      padding: 3px;
    }
    .segmented button {
      background: transparent;
      border: 0;
      border-radius: 7px;
      font-size: 10px;
      height: 28px;
      min-width: 34px;
      padding: 0 9px;
    }
    .segmented button.active { background: var(--surface); box-shadow: 0 1px 3px rgb(31 35 42 / 11%); }
    .preview-actions { align-items: center; display: flex; gap: 7px; justify-content: flex-end; }
    .preview-stage {
      align-items: center;
      display: flex;
      justify-content: center;
      min-height: 0;
      padding: 24px;
      position: relative;
    }
    .preview-stage img {
      filter: drop-shadow(0 13px 25px rgb(31 35 42 / 13%));
      max-height: 94%;
      max-width: 84%;
    }
    .preview-nav {
      align-items: center;
      background: rgb(255 255 255 / 96%);
      border: 1px solid var(--border);
      border-radius: 999px;
      bottom: 16px;
      box-shadow: 0 9px 24px rgb(31 35 42 / 13%);
      display: flex;
      gap: 12px;
      left: 50%;
      min-height: 34px;
      padding: 6px 12px;
      position: absolute;
      transform: translateX(-50%);
    }
    .preview-nav button { background: transparent; border: 0; font-size: 10px; }
    .preview-nav span { color: var(--secondary); font-size: 9px; }

    .compare-grid {
      display: grid;
      gap: 11px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      min-height: 0;
      padding: 12px;
    }
    .compare-pane {
      background: var(--surface);
      border: 1px solid var(--border);
      display: grid;
      grid-template-rows: 30px minmax(0, 1fr) 28px;
      min-height: 0;
    }
    .compare-pane.active { border-color: var(--accent); box-shadow: 0 0 0 2px rgb(88 105 207 / 12%); }
    .compare-head, .compare-foot { align-items: center; display: flex; font-size: 9px; justify-content: space-between; padding: 0 9px; }
    .compare-head { border-bottom: 1px solid var(--border); }
    .compare-foot { border-top: 1px solid var(--border); color: var(--secondary); }
    .compare-stage { background: #f7f7f5; min-height: 0; overflow: hidden; }

    .text-stage {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      min-height: 0;
    }
    .document-wrap { overflow: auto; padding: 24px; }
    .document {
      background: var(--surface);
      margin: 0 auto;
      max-width: 790px;
      min-height: 100%;
      padding: 34px 42px;
    }
    .document h1 { font-size: 21px; letter-spacing: -.03em; margin: 0 0 14px; }
    .document h2 { font-size: 15px; margin: 25px 0 8px; }
    .document p, .document li { color: #4f545b; font-size: 11px; line-height: 1.75; }
    .document code { background: var(--soft); border-radius: 5px; color: #4152b4; padding: 2px 5px; }
    .inspector {
      background: var(--surface);
      border-left: 1px solid var(--border);
      box-shadow: -12px 0 30px rgb(31 35 42 / 7%);
      overflow: auto;
      padding: 18px;
    }
    .inspector h2 { font-size: 14px; margin: 0 0 15px; }
    .info-group { border-top: 1px solid var(--border); padding: 13px 0; }
    .info-group:first-of-type { border-top: 0; padding-top: 0; }
    .info-group h3 { color: var(--secondary); font-size: 9px; letter-spacing: .06em; margin: 0 0 8px; text-transform: uppercase; }
    .info-row { display: grid; font-size: 10px; gap: 10px; grid-template-columns: 88px 1fr; margin: 7px 0; }
    .info-row span:first-child { color: var(--tertiary); }

    /* Dialogs and feedback */
    .scrim {
      align-items: center;
      background: rgb(28 31 35 / 24%);
      display: flex;
      inset: 0;
      justify-content: center;
      position: absolute;
      z-index: 25;
    }
    .dialog {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow-dialog);
      max-height: calc(100% - 48px);
      overflow: auto;
      padding: 20px;
      width: 430px;
    }
    .dialog.wide { width: min(760px, calc(100% - 52px)); }
    .dialog h2 { font-size: 16px; letter-spacing: -.02em; margin: 0; }
    .dialog > p { color: var(--secondary); font-size: 11px; line-height: 1.55; margin: 8px 0 16px; }
    .dialog-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
    .dialog-grid { display: grid; gap: 14px; grid-template-columns: 220px 1fr; }
    .dialog-panel { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .dialog-panel h3 { background: var(--soft); border-bottom: 1px solid var(--border); font-size: 10px; margin: 0; padding: 10px; }
    .dialog-panel .panel-body { padding: 10px; }
    .conflict-row {
      align-items: center;
      border-bottom: 1px solid #ececea;
      display: grid;
      font-size: 9px;
      gap: 8px;
      grid-template-columns: minmax(130px, 1fr) auto;
      padding: 8px 0;
    }
    .conflict-row:last-child { border-bottom: 0; }
    .conflict-row span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .readonly-banner {
      align-items: center;
      background: var(--warning-soft);
      border-bottom: 1px solid #e5dcc5;
      color: var(--warning);
      display: flex;
      font-size: 10px;
      height: 38px;
      justify-content: space-between;
      padding: 0 14px;
    }
    .notice-stack { display: grid; gap: 8px; position: absolute; right: 14px; top: 14px; z-index: 15; }
    .notice {
      align-items: center;
      background: rgb(255 255 255 / 97%);
      border: 1px solid var(--border);
      border-radius: 11px;
      box-shadow: 0 10px 28px rgb(31 35 42 / 13%);
      display: flex;
      gap: 14px;
      justify-content: space-between;
      padding: 11px 12px;
      width: 290px;
    }
    .notice strong, .notice span { display: block; }
    .notice strong { font-size: 11px; }
    .notice span { color: var(--secondary); font-size: 9px; margin-top: 3px; }
    .task-surface {
      background: rgb(255 255 255 / 97%);
      border: 1px solid var(--border);
      border-radius: 12px;
      bottom: 14px;
      box-shadow: 0 12px 34px rgb(31 35 42 / 14%);
      padding: 11px 12px;
      position: absolute;
      right: 14px;
      width: 320px;
      z-index: 15;
    }
    .task-head { align-items: center; display: flex; font-size: 10px; justify-content: space-between; }
    .task-head strong { font-size: 11px; }
    .progress-track { background: #e9e9e7; border-radius: 99px; height: 3px; margin-top: 9px; overflow: hidden; }
    .progress-fill { background: var(--accent); height: 100%; width: 68%; }
    .local-error {
      background: var(--danger-soft);
      border: 1px solid #e7c9c5;
      border-radius: 9px;
      color: var(--danger);
      font-size: 10px;
      margin: 14px;
      padding: 11px 12px;
    }

    /* Empty, launch and visual system */
    .empty-window {
      align-items: center;
      background: var(--application);
      display: flex;
      height: 100%;
      justify-content: center;
      position: relative;
    }
    .empty-content { text-align: center; }
    .empty-content h1 { font-size: 22px; letter-spacing: -.04em; margin: 0; }
    .empty-content p { color: var(--secondary); font-size: 12px; margin: 10px 0 17px; }
    .opening-line { background: #e4e4e1; border-radius: 99px; height: 3px; margin: 15px auto 0; overflow: hidden; width: 180px; }
    .opening-line span { background: var(--accent); display: block; height: 100%; width: 44%; }
    .drop-target { border: 2px solid var(--accent); border-radius: 14px; inset: 22px; position: absolute; }
    .drop-target span {
      background: var(--accent);
      border-radius: 999px;
      color: white;
      font-size: 10px;
      left: 50%;
      padding: 6px 10px;
      position: absolute;
      top: 48px;
      transform: translateX(-50%);
    }

    .skeleton { animation: breathe 1.6s ease-in-out infinite; background: #ececea; border-radius: 6px; }
    @keyframes breathe { 0%,100% { opacity: .6; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } }
    .skeleton-row { height: 18px; margin: 6px 8px; }
    .skeleton-grid { display: grid; gap: 12px; grid-template-columns: repeat(4, 1fr); padding: 14px; }
    .skeleton-card { height: 190px; }

    .reference-scene {
      background: #f1f1ef;
      height: 100%;
      overflow: auto;
      padding: 18px;
    }
    .reference-scene img { display: block; height: auto; margin: 0 auto; max-width: 100%; }
    .reference-caption {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(3, 1fr);
      margin: 12px auto 0;
      max-width: 1080px;
      padding: 13px;
    }
    .reference-caption strong { display: block; font-size: 10px; margin-bottom: 4px; }
    .reference-caption span { color: var(--secondary); font-size: 9px; line-height: 1.5; }

    .system-sheet { background: #f6f6f4; height: 100%; overflow: auto; padding: 24px; }
    .sheet-header h1 { font-size: 22px; letter-spacing: -.035em; margin: 0; }
    .sheet-header p { color: var(--secondary); font-size: 11px; margin: 7px 0 20px; }
    .system-section { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 14px; padding: 16px; }
    .system-section h2 { font-size: 13px; margin: 0 0 12px; }
    .token-grid { display: grid; gap: 9px; grid-template-columns: repeat(8, 1fr); }
    .token { min-width: 0; }
    .swatch { border: 1px solid rgb(31 35 42 / 8%); border-radius: 8px; height: 52px; }
    .token strong, .token span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .token strong { font-size: 9px; margin-top: 6px; }
    .token span { color: var(--tertiary); font-size: 8px; margin-top: 2px; }
    .component-grid { display: grid; gap: 14px; grid-template-columns: repeat(3, 1fr); }
    .component-sample { border: 1px solid #ececea; border-radius: 10px; min-height: 130px; padding: 13px; }
    .component-sample h3 { color: var(--secondary); font-size: 9px; letter-spacing: .05em; margin: 0 0 12px; text-transform: uppercase; }
    .sample-stack { align-items: flex-start; display: flex; flex-wrap: wrap; gap: 8px; }
    .type-scale .type-large { font-size: 20px; font-weight: 700; }
    .type-scale .type-section { font-size: 14px; font-weight: 650; margin-top: 8px; }
    .type-scale .type-body { font-size: 13px; margin-top: 8px; }
    .type-scale .type-caption { color: var(--secondary); font-size: 11px; margin-top: 8px; }

    @media (max-width: 980px) {
      .atlas { grid-template-columns: 190px minmax(0, 1fr); }
      .atlas-sidebar { padding-left: 9px; padding-right: 9px; }
      .stage { padding: 12px; }
      .token-grid { grid-template-columns: repeat(4, 1fr); }
      .component-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="atlas">
    <aside class="atlas-sidebar">
      <div class="atlas-brand">
        <strong>Viewer UI</strong>
        <span>Complete Visual Atlas</span>
        <span class="draft-badge">视觉审阅稿 A</span>
      </div>
      <nav class="atlas-nav" aria-label="界面目录">
        <p class="nav-label">视觉基础</p>
        <button class="nav-item" data-screen="overview" aria-current="page">设计总览 <span>01</span></button>
        <button class="nav-item" data-screen="system">组件与规范 <span>02</span></button>

        <p class="nav-label">工作区</p>
        <button class="nav-item" data-screen="folder">项目总览 <span>03</span></button>
        <button class="nav-item" data-screen="browser">内容浏览 <span>04</span></button>
        <button class="nav-item" data-screen="search">搜索与筛选 <span>05</span></button>

        <p class="nav-label">查看内容</p>
        <button class="nav-item" data-screen="preview">图片预览 <span>06</span></button>
        <button class="nav-item" data-screen="compare">多图对比 <span>07</span></button>
        <button class="nav-item" data-screen="text">文本与信息 <span>08</span></button>

        <p class="nav-label">操作与状态</p>
        <button class="nav-item" data-screen="radial">圆盘菜单 <span>09</span></button>
        <button class="nav-item" data-screen="dialogs">对话框 <span>10</span></button>
        <button class="nav-item" data-screen="feedback">任务与反馈 <span>11</span></button>
        <button class="nav-item" data-screen="launch">未打开与加载 <span>12</span></button>
      </nav>
      <p class="atlas-note">单文件视觉样机。所有 Viewer 自有界面共用一套白色、暖灰与靛蓝状态语言。</p>
    </aside>

    <main class="atlas-main">
      <header class="atlas-toolbar">
        <div class="scene-title">
          <strong id="scene-name">设计总览</strong>
          <span id="scene-description">查看完整视觉方向与关键硬规则</span>
        </div>
        <div class="atlas-controls">
          <div class="atlas-segment" aria-label="预览尺寸">
            <button type="button" data-viewport="1024" aria-pressed="false">1024 × 720</button>
            <button type="button" data-viewport="1440" aria-pressed="true">1440 × 900</button>
          </div>
          <button type="button" class="atlas-control" id="fit-control">适应窗口</button>
        </div>
      </header>

      <section class="stage">
        <div class="stage-inner" id="stage">
          <div class="scale-box" id="scale-box">
            <div class="screen-mount" id="screen-mount"></div>
          </div>
        </div>
      </section>

      <footer class="atlas-footer">
        <span id="state-note">可点击左侧目录逐项检查；缩略图和菜单状态可交互。</span>
        <span class="coverage">12 类界面 · 组件全覆盖</span>
      </footer>
    </main>
  </div>

  <script>
    const assetBase = "/files/";
    const images = Array.from({ length: 8 }, (_, index) => `${assetBase}asset-browse-${String(index + 1).padStart(2, "0")}.jpg`);
    const references = {
      density: `${assetBase}asset-reference-density.png`,
      radial: `${assetBase}asset-reference-radial.png`,
      preview: `${assetBase}asset-reference-preview.png`,
    };

    const screenMeta = {
      overview: ["设计总览", "查看完整视觉方向与关键硬规则"],
      system: ["组件与规范", "色彩、字体、按钮、菜单、表单、状态与反馈组件"],
      folder: ["项目总览", "连续安静文件夹带，不使用悬浮卡片"],
      browser: ["内容浏览", "40 px 顶栏、24 px 目录行、缩略图内部选中框"],
      search: ["搜索与筛选", "紧凑结果列表与锚定筛选弹层"],
      preview: ["图片预览", "52 px 三段工具栏、浅色舞台与可见“完成”"],
      compare: ["多图对比", "共享预览语言、10–12 px 间距与明确活动面板"],
      text: ["文本与信息", "统一预览壳、阅读表面和右侧检查器"],
      radial: ["圆盘菜单", "唯一文件操作菜单，保留六扇区与外扩二级扇区"],
      dialogs: ["对话框", "统一壳、明确影响范围与克制危险操作"],
      feedback: ["任务与反馈", "单一任务表面、范围化通知、只读与局部错误"],
      launch: ["未打开与加载", "静止状态严格三个元素，加载保持最终几何"],
    };

    const state = {
      screen: "overview",
      viewport: { width: 1440, height: 900 },
      fit: true,
      openMenu: null,
      dialog: "destination",
      launch: "empty",
    };

    const embedParams = new URLSearchParams(location.hash.slice(1));
    const embedScreen = embedParams.get("embed");
    if (embedScreen && Object.hasOwn(screenMeta, embedScreen)) {
      document.body.classList.add("embed");
      state.screen = embedScreen;
      state.viewport = embedParams.get("viewport") === "1024"
        ? { width: 1024, height: 720 }
        : { width: 1440, height: 900 };
      state.fit = false;
      const embedState = embedParams.get("state");
      if (embedScreen === "launch" && ["empty", "drag", "opening", "scan"].includes(embedState)) {
        state.launch = embedState;
      }
      if (embedScreen === "dialogs" && ["destination", "rename", "trash", "close"].includes(embedState)) {
        state.dialog = embedState;
      }
    }

    function image(index, alt, className = "") {
      return `<img src="${images[index % images.length]}" alt="${alt}" class="${className}">`;
    }

    function sidebar(selected = "A01", loading = false) {
      if (loading) {
        return `<aside class="viewer-sidebar"><p class="tree-label">项目目录</p>${Array.from({ length: 10 }, () => '<div class="skeleton skeleton-row"></div>').join("")}</aside>`;
      }
      const rows = [
        ["测试图", "42"],
        ["角色", ""],
        ["B01", "12", true],
        ["B02", "8", true],
        ["B03", "15", true],
        ["衣服", ""],
        ["A01", "30", true],
        ["A02", "30", true],
        ["A03", "9", true],
        ["A04", "20", true],
        ["详情素材", "3"],
      ];
      return `<aside class="viewer-sidebar"><p class="tree-label">项目目录</p>${rows.map(([label, count, child]) => `<div class="tree-row${child ? " child" : ""}${label === selected ? " selected" : ""}"><span>${label}</span><span>${count}</span></div>`).join("")}</aside>`;
    }

    function menuMarkup(type) {
      if (type === "view") {
        return `<div class="popover" data-popover-panel>
          <button class="menu-row selected" type="button"><span>按文件夹分组</span><span>当前</span></button>
          <button class="menu-row" type="button"><span>展平结果</span><span></span></button>
          <div class="menu-divider"></div>
          <button class="menu-row" type="button"><span>显示全部后代文件</span><span></span></button>
          <button class="menu-row" type="button"><span>全选当前文件夹</span><span>⌘A</span></button>
        </div>`;
      }
      if (type === "more") {
        return `<div class="popover" data-popover-panel>
          <button class="menu-row" type="button"><span>软件设置</span><span></span></button>
          <button class="menu-row" type="button"><span>访问状态</span><span></span></button>
          <div class="menu-divider"></div>
          <button class="menu-row danger" type="button"><span>关闭项目</span><span></span></button>
        </div>`;
      }
      return "";
    }

    function shell(content, options = {}) {
      const selected = options.selected ?? "A01";
      const toolbar = options.toolbar !== false;
      return `<div class="viewer-window">
        <div class="viewer-shell">
          <header class="project-head"><strong>${options.project ?? "测试图"}</strong><button type="button">收起</button></header>
          <header class="viewer-toolbar">
            ${toolbar ? `<label class="search-field"><input aria-label="搜索" placeholder="${options.search ?? "搜索名称、路径或文本"}"><kbd>⌘F</kbd></label>
              <button class="viewer-button${options.filterActive ? " active" : ""}" type="button" data-open="filter">筛选${options.filterActive ? " · 3" : ""}</button>
              <button class="viewer-button${state.openMenu === "view" ? " active" : ""}" type="button" data-open="view">视图</button>
              <button class="viewer-button${state.openMenu === "more" ? " active" : ""}" type="button" data-open="more">更多</button>
              ${menuMarkup(state.openMenu)}` : ""}
          </header>
          ${sidebar(selected, options.loading)}
          <section class="viewer-content">${content}</section>
        </div>
      </div>`;
    }

    function imageCards(selectedCount = 1) {
      const labels = ["2C2A7469.JPG", "2C2A7536.JPG", "2C2A7494.JPG", "2C2A8388.JPG", "2C2A8406.JPG", "4-1205749.jpg", "4-1605917.jpg", "4I8A5307.jpg"];
      const states = ["待定", "保留", "", "", "", "淘汰", "", ""];
      return labels.map((label, index) => `<article class="image-card${index < selectedCount ? " selected" : ""}" tabindex="0" aria-selected="${index < selectedCount}">
        <div class="image-stage">${image(index, label)}</div>
        <div class="image-meta"><strong>${label}</strong>${states[index] ? `<span class="status-tag ${states[index] === "保留" ? "keep" : states[index] === "淘汰" ? "reject" : "pending"}">${states[index]}</span>` : ""}</div>
      </article>`).join("");
    }

    function overviewScreen() {
      return `<div class="reference-scene">
        <img src="${references.density}" alt="Viewer A 紧凑高效视觉方向参考">
        <div class="reference-caption">
          <div><strong>A · 紧凑高效</strong><span>主工作区 40 px 顶栏、目录文字 18 px 行盒、24 px 完整行高，屏内空间优先留给内容。</span></div>
          <div><strong>白色跨平台系统</strong><span>Viewer 自有界面共享白色、暖灰、靛蓝状态色；macOS 与 Windows 只在系统边界保留差异。</span></div>
          <div><strong>深度有明确原因</strong><span>普通内容没有阴影；只有菜单、对话框、任务、检查器和浮动导航拥有克制层级。</span></div>
        </div>
      </div>`;
    }

    function systemScreen() {
      const tokens = [
        ["Canvas", "#F3F3F1"], ["Application", "#FAFAF8"], ["Surface", "#FFFFFF"], ["Sidebar", "#EFF0EF"],
        ["Border", "#DEDFDD"], ["Accent", "#5869CF"], ["Warning", "#76591D"], ["Danger", "#B7463F"],
      ];
      return `<div class="system-sheet">
        <div class="sheet-header"><h1>Viewer 视觉系统</h1><p>所有界面只使用下列语义 token、间距、圆角、焦点和动效规则。</p></div>
        <section class="system-section"><h2>色彩</h2><div class="token-grid">${tokens.map(([name, value]) => `<div class="token"><div class="swatch" style="background:${value}"></div><strong>${name}</strong><span>${value}</span></div>`).join("")}</div></section>
        <section class="system-section"><h2>组件状态</h2>
          <div class="component-grid">
            <div class="component-sample"><h3>按钮</h3><div class="sample-stack"><button class="viewer-button primary">主要操作</button><button class="viewer-button">次要操作</button><button class="viewer-button active">已激活</button><button class="viewer-button danger">危险操作</button><button class="viewer-button" disabled>不可用</button></div></div>
            <div class="component-sample"><h3>输入与分段控件</h3><div class="sample-stack" style="display:grid"><label class="search-field" style="width:100%"><input placeholder="搜索名称、路径或文本"><kbd>⌘F</kbd></label><div class="segmented"><button class="active">适应</button><button>100%</button><button>75%</button></div></div></div>
            <div class="component-sample"><h3>语义标签</h3><div class="sample-stack"><span class="status-tag keep">保留</span><span class="status-tag pending">待定</span><span class="status-tag reject">淘汰</span><span class="chip active">筛选 3</span></div></div>
            <div class="component-sample"><h3>菜单行</h3><div style="border:1px solid var(--border);border-radius:10px;padding:6px"><button class="menu-row selected"><span>按文件夹分组</span><span>当前</span></button><button class="menu-row"><span>显示全部后代文件</span><span></span></button><div class="menu-divider"></div><button class="menu-row danger"><span>关闭项目</span><span></span></button></div></div>
            <div class="component-sample"><h3>缩略图选中</h3><article class="image-card selected" style="max-width:180px"><div class="image-stage" style="height:90px">${image(2, "选中缩略图")}</div><div class="image-meta"><strong>2C2A7494.JPG</strong></div></article></div>
            <div class="component-sample type-scale"><h3>字体层级</h3><div class="type-large">主要视图标题</div><div class="type-section">分区标题</div><div class="type-body">正文与主行内容</div><div class="type-caption">说明、元数据与次要控件</div></div>
            <div class="component-sample"><h3>任务表面</h3><div class="task-surface" style="position:relative;bottom:auto;right:auto;width:100%"><div class="task-head"><strong>正在生成缩略图</strong><span>68 / 100</span></div><div class="progress-track"><div class="progress-fill"></div></div></div></div>
            <div class="component-sample"><h3>通知与局部错误</h3><div class="notice" style="position:relative;width:100%;box-shadow:none"><div><strong>项目状态已恢复</strong><span>8 项已恢复，1 项需要检查</span></div><button class="viewer-button">查看</button></div><div class="local-error" style="margin:8px 0 0">缩略图不可用 · 重试</div></div>
            <div class="component-sample"><h3>对话框动作</h3><p style="color:var(--secondary);font-size:10px">取消始终在安全主操作或危险操作之前；危险色只落在最终动作。</p><div class="dialog-actions"><button class="viewer-button">取消</button><button class="viewer-button primary">确认</button></div></div>
          </div>
        </section>
      </div>`;
    }

    function folderScreen() {
      const rows = [
        ["A01", "衣服/A01", "30 张图片 · 0 个其它文件", [0, 1, 2, 3]],
        ["A02", "衣服/A02", "30 张图片 · 0 个其它文件", [4, 5, 6, 7]],
        ["A03", "衣服/A03", "9 张图片 · 0 个其它文件", [1, 3, 5, 7]],
      ];
      const bands = rows.map(([id, path, count, indexes]) => `<section class="folder-band"><div class="folder-identity"><strong>${id}</strong><span>${path}</span><span>${count}</span><span class="folder-state">文件夹：未标记</span></div><div class="filmstrip">${indexes.map((index) => `<figure>${image(index, `${id} 图片`)}</figure>`).join("")}</div></section>`).join("");
      return shell(bands, { selected: "测试图" });
    }

    function browserScreen() {
      return shell(`<div class="grid-wrap"><div class="image-grid">${imageCards(1)}</div><div class="other-files">其它文件 · 3 · 展开</div><div class="selection-summary"><strong>已选择 1 项</strong><span>右键打开圆盘菜单 · Esc 取消选择</span></div></div>`);
    }

    function searchScreen() {
      const results = Array.from({ length: 7 }, (_, index) => `<div class="result-row${index === 0 ? " selected" : ""}"><span class="result-thumb">${image(index, "搜索结果缩略图")}</span><div class="result-copy"><strong>2C2A${7469 + index * 11}.JPG</strong><span>衣服/A0${(index % 3) + 1}/2C2A${7469 + index * 11}.JPG</span></div><div class="result-snippet">文件名与路径匹配“<mark>连体衣</mark>”</div>${index < 2 ? '<span class="status-tag pending">待定</span>' : "<span></span>"}</div>`).join("");
      const panel = `<section class="filter-panel"><div class="panel-title"><strong>筛选</strong><button type="button">关闭</button></div><div class="filter-grid"><div class="field"><label>搜索范围</label><select><option>整个项目</option></select></div><div class="field"><label>排序</label><select><option>文件名 · 升序</option></select></div><div class="field" style="grid-column:1/-1"><label>文件类型</label><div class="filter-options"><button class="chip active">图片</button><button class="chip">Markdown</button><button class="chip">文本</button><button class="chip">其它</button></div></div><div class="field" style="grid-column:1/-1"><label>审阅状态</label><div class="filter-options"><button class="chip active">保留</button><button class="chip active">待定</button><button class="chip">淘汰</button><button class="chip">未标记</button></div></div><button class="menu-row" style="grid-column:1/-1"><span>高级条件</span><span>展开</span></button></div><div class="filter-footer"><button class="menu-row" style="width:auto">清除全部</button><button class="viewer-button primary">应用筛选</button></div></section>`;
      return shell(`<div class="search-summary"><strong>“连体衣” · 42 个结果</strong><span>索引已完成</span></div><div class="result-group"><span>衣服 / A01</span><span>18</span></div>${results}${panel}`, { search: "连体衣", filterActive: true });
    }

    function previewScreen() {
      return `<div class="viewer-window"><div class="preview-shell"><header class="preview-toolbar"><div class="preview-identity"><strong>2C2A7469.JPG</strong><span>2400 × 3200 · 3.8 MB</span></div><div class="segmented"><button class="active">适应</button><button>100%</button><button>缩小</button><button>74%</button><button>放大</button></div><div class="preview-actions"><button class="viewer-button">旋转</button><button class="viewer-button primary">完成</button></div></header><section class="preview-stage">${image(0, "图片预览")}<div class="preview-nav"><button>上一张</button><span>1 / 30</span><button>下一张</button></div></section></div></div>`;
    }

    function compareScreen() {
      const panes = [0, 1, 2, 3].map((index) => `<article class="compare-pane${index === 0 ? " active" : ""}"><header class="compare-head"><strong>2C2A${7469 + index * 27}.JPG</strong><button class="menu-row" style="width:auto;min-height:24px;padding:2px 5px">移除</button></header><div class="compare-stage">${image(index, "对比图片")}</div><footer class="compare-foot"><span>${index === 0 ? "活动面板" : "未标记"}</span><span>收藏</span></footer></article>`).join("");
      return `<div class="viewer-window"><div class="preview-shell"><header class="preview-toolbar"><div class="preview-identity"><strong>4 张图片</strong><span>当前：2C2A7469.JPG</span></div><div class="segmented"><button class="active">适应</button><button>100%</button><button>缩小</button><button>放大</button><button>旋转</button></div><div class="preview-actions"><button class="viewer-button active">同步变换</button><button class="viewer-button primary">完成</button></div></header><section class="compare-grid">${panes}</section></div></div>`;
    }

    function textScreen() {
      return `<div class="viewer-window"><div class="preview-shell"><header class="preview-toolbar"><div class="preview-identity"><strong>产品说明.md</strong><span>Markdown · UTF-8</span></div><div class="segmented"><button class="active">阅读</button><button>纯文本</button></div><div class="preview-actions"><button class="viewer-button">编码 UTF-8</button><button class="viewer-button primary">完成</button></div></header><section class="text-stage"><div class="document-wrap"><article class="document"><h1>春夏儿童服装拍摄说明</h1><p>本项目用于整理商品图片、审阅状态与最终交付素材。Viewer 保持原始文件比例，并允许在一个工作区内完成筛选、比较和整理。</p><h2>文件组织</h2><p>图片按品类和款号放入对应目录。使用 <code>保留</code>、<code>待定</code> 与 <code>淘汰</code> 标记完成第一轮筛选。</p><h2>交付检查</h2><ul><li>确认正面、背面与细节图完整。</li><li>检查画面裁切、颜色与文件命名。</li><li>通过并排对比确认同款图片一致性。</li></ul></article></div><aside class="inspector"><h2>文件信息</h2><section class="info-group"><h3>身份与位置</h3><div class="info-row"><span>文件名</span><span>产品说明.md</span></div><div class="info-row"><span>位置</span><span>项目根目录</span></div><div class="info-row"><span>大小</span><span>18 KB</span></div></section><section class="info-group"><h3>审阅与收藏</h3><div class="info-row"><span>审阅状态</span><span>未标记</span></div><div class="info-row"><span>收藏</span><span>否</span></div></section><section class="info-group"><h3>技术信息</h3><div class="info-row"><span>格式</span><span>Markdown</span></div><div class="info-row"><span>编码</span><span>UTF-8</span></div><div class="info-row"><span>修改时间</span><span>今天 14:32</span></div></section></aside></section></div></div>`;
    }

    function radialScreen() {
      return `<div class="reference-scene"><img src="${references.radial}" alt="批准的六扇区圆盘菜单参考"><div class="reference-caption"><div><strong>唯一菜单</strong><span>普通右键、Control-click、手势和键盘菜单键全部打开同一个圆盘。</span></div><div><strong>固定几何</strong><span>一级 42–108 px、六个 60° 扇区；标记与整理使用 112–168 px 外扩二级扇区。</span></div><div><strong>选择边界</strong><span>圆盘作用于当前选择；缩略图选中框始终内缩 6 px，绝不包围文件名。</span></div></div></div>`;
    }

    function dialogsScreen() {
      const tabs = `<div class="segmented prototype-state-switcher" style="margin-bottom:14px"><button class="${state.dialog === "destination" ? "active" : ""}" data-dialog="destination">目标与冲突</button><button class="${state.dialog === "rename" ? "active" : ""}" data-dialog="rename">批量重命名</button><button class="${state.dialog === "trash" ? "active" : ""}" data-dialog="trash">废纸篓确认</button><button class="${state.dialog === "close" ? "active" : ""}" data-dialog="close">关闭任务</button></div>`;
      let body = "";
      if (state.dialog === "destination") {
        body = `<div class="dialog wide"><h2>移动到文件夹</h2><p>选择目标并检查冲突。预检完成前不会执行任何文件操作。</p>${tabs}<div class="dialog-grid"><section class="dialog-panel"><h3>项目目录</h3><div class="panel-body"><div class="tree-row">角色</div><div class="tree-row child">B01</div><div class="tree-row">衣服</div><div class="tree-row child selected">A02</div><div class="tree-row child">A03</div></div></section><section class="dialog-panel"><h3>预检结果 · 3 项冲突</h3><div class="panel-body"><div class="conflict-row"><span>2C2A7469.JPG · 已存在</span><select><option>替换</option></select></div><div class="conflict-row"><span>2C2A7536.JPG · 已存在</span><select><option>保留两者</option></select></div><div class="conflict-row"><span>2C2A7494.JPG · 可移动</span><span class="status-tag keep">就绪</span></div></div></section></div><div class="dialog-actions"><button class="viewer-button">取消</button><button class="viewer-button primary">移动 3 个文件</button></div></div>`;
      } else if (state.dialog === "rename") {
        body = `<div class="dialog wide"><h2>批量重命名</h2><p>预览全部文件的新名称；无效或冲突项目不会执行。</p>${tabs}<div class="filter-grid"><div class="field"><label>查找</label><input value="2C2A"></div><div class="field"><label>替换为</label><input value="LOOK-"></div><div class="field"><label>前缀</label><input placeholder="可选"></div><div class="field"><label>起始序号</label><input value="001"></div></div><section class="dialog-panel" style="margin-top:14px"><h3>预览 · 28 项可执行 · 2 项无效</h3><div class="panel-body"><div class="conflict-row"><span>2C2A7469.JPG</span><span>LOOK-001.JPG</span></div><div class="conflict-row"><span>2C2A7536.JPG</span><span>LOOK-002.JPG</span></div><div class="conflict-row" style="color:var(--danger)"><span>2C2A7494.JPG</span><span>名称冲突</span></div></div></section><div class="dialog-actions"><button class="viewer-button">取消</button><button class="viewer-button primary">重命名 28 个文件</button></div></div>`;
      } else if (state.dialog === "trash") {
        body = `<div class="dialog"><h2>将 3 个文件移到废纸篓？</h2><p>这些文件将进入 macOS 废纸篓。操作完成后可以通过系统废纸篓恢复。</p>${tabs}<div class="dialog-actions"><button class="viewer-button">取消</button><button class="viewer-button danger">移到废纸篓</button></div></div>`;
      } else {
        body = `<div class="dialog"><h2>文件操作仍在进行</h2><p>已完成的工作不会撤销，当前原子步骤会安全完成。请选择关闭方式。</p>${tabs}<div style="display:grid;gap:8px"><button class="menu-row selected"><span>等待完成后关闭</span><span>推荐</span></button><button class="menu-row"><span>保持打开</span><span></span></button><button class="menu-row danger"><span>取消待处理项目并关闭</span><span></span></button></div></div>`;
      }
      return shell(`<div class="grid-wrap"><div class="image-grid">${imageCards(2)}</div></div><div class="scrim">${body}</div>`);
    }

    function feedbackScreen() {
      return shell(`<div class="readonly-banner"><span><strong>只读模式</strong> · 浏览、搜索和预览仍可用；标记与整理已停用。</span><span>权限设置　重新选择目录</span></div><div class="grid-wrap"><div class="image-grid">${imageCards(0)}</div></div><div class="local-error">A03 中的一个缩略图无法生成。其它文件仍可继续浏览。　重试</div><div class="notice-stack"><article class="notice"><div><strong>项目状态已恢复</strong><span>8 项已恢复，1 项需要检查</span></div><button class="viewer-button">查看</button></article></div><article class="task-surface"><div class="task-head"><strong>正在生成缩略图</strong><span>68 / 100 · 2 项任务</span></div><div class="progress-track"><div class="progress-fill"></div></div></article>`, { filterActive: false });
    }

    function launchScreen() {
      const tabs = `<div class="segmented prototype-state-switcher" style="position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:4"><button class="${state.launch === "empty" ? "active" : ""}" data-launch="empty">未打开项目</button><button class="${state.launch === "drag" ? "active" : ""}" data-launch="drag">拖入状态</button><button class="${state.launch === "opening" ? "active" : ""}" data-launch="opening">验证中</button><button class="${state.launch === "scan" ? "active" : ""}" data-launch="scan">扫描中</button></div>`;
      if (state.launch === "scan") {
        return `${shell(`<div class="skeleton-grid">${Array.from({ length: 8 }, () => '<div class="skeleton skeleton-card"></div>').join("")}</div><article class="task-surface"><div class="task-head"><strong>正在扫描项目</strong><span>已发现 1,284 个文件</span></div><div class="progress-track"><div class="progress-fill" style="width:45%"></div></div></article>`, { loading: true })}${tabs}`;
      }
      const drag = state.launch === "drag" ? '<div class="drop-target"><span>松开以打开项目</span></div>' : "";
      const content = state.launch === "opening" ? `<div class="empty-content"><h1>测试图</h1><p>正在验证项目…</p><div class="opening-line"><span></span></div></div>` : `<div class="empty-content"><h1>Viewer</h1><p>选择或拖入一个项目文件夹</p><button class="viewer-button primary">选择项目文件夹</button></div>`;
      return `<div class="viewer-window"><div class="empty-window">${tabs}${content}${drag}</div></div>`;
    }

    const renderers = {
      overview: overviewScreen,
      system: systemScreen,
      folder: folderScreen,
      browser: browserScreen,
      search: searchScreen,
      preview: previewScreen,
      compare: compareScreen,
      text: textScreen,
      radial: radialScreen,
      dialogs: dialogsScreen,
      feedback: feedbackScreen,
      launch: launchScreen,
    };

    const mount = document.getElementById("screen-mount");
    const scaleBox = document.getElementById("scale-box");
    const stage = document.getElementById("stage");

    function updateScale() {
      const availableWidth = Math.max(320, stage.clientWidth - 36);
      const availableHeight = Math.max(320, stage.clientHeight - 36);
      const scale = state.fit ? Math.min(1, availableWidth / state.viewport.width, availableHeight / state.viewport.height) : 1;
      mount.style.width = `${state.viewport.width}px`;
      mount.style.height = `${state.viewport.height}px`;
      mount.style.transform = `scale(${scale})`;
      scaleBox.style.width = `${state.viewport.width * scale}px`;
      scaleBox.style.height = `${state.viewport.height * scale}px`;
    }

    function render() {
      state.openMenu = ["folder", "browser", "feedback"].includes(state.screen) ? state.openMenu : null;
      mount.innerHTML = renderers[state.screen]();
      document.getElementById("scene-name").textContent = screenMeta[state.screen][0];
      document.getElementById("scene-description").textContent = screenMeta[state.screen][1];
      document.querySelectorAll(".nav-item").forEach((item) => item.setAttribute("aria-current", item.dataset.screen === state.screen ? "page" : "false"));
      document.querySelectorAll("[data-viewport]").forEach((button) => button.setAttribute("aria-pressed", String(Number(button.dataset.viewport) === state.viewport.width)));
      document.getElementById("fit-control").textContent = state.fit ? "适应窗口" : "原始尺寸";
      updateScale();
    }

    document.addEventListener("click", (event) => {
      const nav = event.target.closest("[data-screen]");
      if (nav) {
        state.screen = nav.dataset.screen;
        state.openMenu = null;
        render();
        return;
      }
      const viewport = event.target.closest("[data-viewport]");
      if (viewport) {
        state.viewport = viewport.dataset.viewport === "1024" ? { width: 1024, height: 720 } : { width: 1440, height: 900 };
        render();
        return;
      }
      if (event.target.closest("#fit-control")) {
        state.fit = !state.fit;
        render();
        return;
      }
      const menu = event.target.closest("[data-open]");
      if (menu) {
        const type = menu.dataset.open;
        if (type === "filter") {
          state.screen = "search";
          state.openMenu = null;
        } else {
          state.openMenu = state.openMenu === type ? null : type;
        }
        render();
        return;
      }
      const dialog = event.target.closest("[data-dialog]");
      if (dialog) {
        state.dialog = dialog.dataset.dialog;
        render();
        return;
      }
      const launch = event.target.closest("[data-launch]");
      if (launch) {
        state.launch = launch.dataset.launch;
        render();
        return;
      }
      const card = event.target.closest(".image-card");
      if (card) {
        card.classList.toggle("selected");
        card.setAttribute("aria-selected", String(card.classList.contains("selected")));
        const summary = mount.querySelector(".selection-summary strong");
        if (summary) {
          const count = mount.querySelectorAll(".image-card.selected").length;
          summary.textContent = `已选择 ${count} 项`;
        }
      }
    });

    document.addEventListener("contextmenu", (event) => {
      if (event.target.closest(".image-card")) {
        event.preventDefault();
        state.screen = "radial";
        render();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && state.openMenu) {
        state.openMenu = null;
        render();
      }
    });

    new ResizeObserver(updateScale).observe(stage);
    render();
  </script>
</body>
</html>
